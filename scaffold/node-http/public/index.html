<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>app</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    input, button { font: inherit; padding: .5rem .75rem; }
    #out { margin-top: 1rem; white-space: pre-wrap; background: #f4f4f4; padding: .75rem; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>app</h1>
  <p id="health">health: 확인 중…</p>
  <form id="f">
    <input id="text" name="text" placeholder="텍스트 입력" />
    <button type="submit">보내기</button>
  </form>
  <div id="out"></div>
  <script>
    fetch('/health').then(r => r.json()).then(j => {
      document.getElementById('health').textContent = 'health: ' + j.status;
    }).catch(() => { document.getElementById('health').textContent = 'health: 실패'; });

    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = document.getElementById('text').value;
      const r = await fetch('/api/echo', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      document.getElementById('out').textContent = r.status + ' ' + (await r.text());
    });
  </script>
</body>
</html>
